name: CI

on:
    pull_request: ~
    push:
        branches: [1.x, 'codex/image-1.3']
        tags: ['*']
    schedule:
        - cron: '0 13 * * MON,TUE'

permissions:
    contents: read

jobs:
    tests:
        name: ${{ matrix.os }} / PHP ${{ matrix.php }} / ${{ matrix.dependencies }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                php: ['8.3', '8.4', '8.5']
                dependencies: [highest]
                include:
                    - {os: ubuntu-latest, php: '8.3', dependencies: lowest}
                    - {os: windows-latest, php: '8.3', dependencies: lowest}
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: exif, dom, fileinfo, gd, intl, mbstring, xml, zlib
                  coverage: none
            - uses: ramsey/composer-install@v3
              with:
                  dependency-versions: ${{ matrix.dependencies }}
            - run: composer validate --strict
            - run: composer unit-tests
            - name: Run consumer with local version override
              run: php examples/consumer/install.php 1.3.99
            - run: php examples/consumer/run.php

    imagick:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: exif, dom, fileinfo, gd, imagick, xml, zlib
                  coverage: pcov
            - uses: ramsey/composer-install@v3
            - run: php vendor/bin/phpunit --coverage-clover=clover.xml
            - uses: codecov/codecov-action@v4
              with:
                  files: ./clover.xml
                  token: ${{ secrets.CODECOV_TOKEN }}

    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: exif, dom, fileinfo, gd, xml, zlib
                  coverage: none
            - uses: ramsey/composer-install@v3
            - uses: ramsey/composer-install@v3
              with:
                  working-directory: tools/ecs
            - uses: ramsey/composer-install@v3
              with:
                  working-directory: tools/phpstan
            - run: composer cs-check
            - run: composer phpstan
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.24'
                  cache: false
            - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
            - run: composer workflow-lint
